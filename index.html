<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MenuCraft – Speisekarten Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;--surface:#181818;--surface2:#202020;--surface3:#282828;
  --border:#2e2e2e;--border2:#3d3d3d;
  --text:#ede9e0;--text2:#9a9488;--text3:#555;
  --accent:#c9a96e;--accent2:#e8c98a;--accent-dim:#7a5f30;
  --danger:#c44;--success:#59a;
  --panel-w:320px;
  --topbar-h:56px;
}

html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 1rem;
  position:relative;z-index:200;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--accent);white-space:nowrap;}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,#c9a96e22,#c9a96e44);border:1px solid var(--accent-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:14px;height:14px;stroke:var(--accent);}
.topbar-center{display:flex;gap:4px;align-items:center;}
.tab-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:.15s;background:transparent;color:var(--text2);}
.tab-btn:hover{background:var(--surface2);color:var(--text);}
.tab-btn.active{background:var(--surface2);border-color:var(--border2);color:var(--text);}
.topbar-right{display:flex;gap:6px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:.15s;border:none;white-space:nowrap;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-accent{background:var(--accent);color:#1a1200;border:1px solid var(--accent);}
.btn-accent:hover{background:var(--accent2);}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent-dim);}
.btn-outline:hover{background:#2a1f0a;}
.menu-toggle{display:none;background:transparent;border:1px solid var(--border);color:var(--text2);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:16px;}

/* ── MAIN ── */
.main{display:flex;flex:1;overflow:hidden;}

/* ── PANEL ── */
.panel{width:var(--panel-w);background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;transition:.25s;}
.panel-tab{display:none;}
.panel-tab.active{display:flex;flex-direction:column;flex:1;}
.sec{padding:1rem 1.25rem;border-bottom:1px solid var(--border);}
.sec:last-child{border-bottom:none;}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:.85rem;}

/* ── FIELDS ── */
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500;}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:7px;font-size:12.5px;font-family:inherit;
  transition:.15s;resize:none;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent-dim);background:var(--surface3);}
textarea{min-height:52px;line-height:1.5;}
input[type=color]{padding:2px 4px;height:32px;cursor:pointer;width:100%;}
select option{background:#222;}

/* ── DESIGNS ── */
.design-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.dc{border:2px solid var(--border);border-radius:9px;padding:8px 6px 7px;cursor:pointer;transition:.15s;text-align:center;background:var(--surface2);}
.dc:hover{border-color:var(--border2);}
.dc.active{border-color:var(--accent);background:#231a08;}
.dt{height:48px;border-radius:5px;margin-bottom:5px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.dn{font-size:10px;color:var(--text2);font-weight:500;}
.dc.active .dn{color:var(--accent);}

/* ── STYLE OPTIONS ── */
.style-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.style-opt{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:.15s;}
.style-opt:hover{border-color:var(--border2);}
.style-opt.on{border-color:var(--accent-dim);background:#231a08;}
.style-opt span{font-size:11.5px;color:var(--text2);}
.style-opt.on span{color:var(--accent);}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;transition:.15s;}
.style-opt.on .dot{background:var(--accent);border-color:var(--accent);}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;}
.color-swatch.on{border-color:#fff;transform:scale(1.15);}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.slider-row label{font-size:11px;color:var(--text2);min-width:90px;}
.slider-row input[type=range]{flex:1;height:3px;accent-color:var(--accent);}
.slider-val{font-size:11px;color:var(--accent);min-width:28px;text-align:right;}

/* ── CATEGORIES ── */
.cat-list{display:flex;flex-direction:column;gap:5px;}
.cat-item{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:.15s;}
.cat-item:hover{border-color:var(--border2);}
.cat-item.active{border-color:var(--accent-dim);background:#231a08;}
.cat-name{flex:1;font-size:12.5px;font-weight:500;}
.cat-count{font-size:10px;color:var(--text3);}
.cat-del{color:var(--text3);padding:2px;border-radius:4px;cursor:pointer;line-height:0;transition:.15s;}
.cat-del:hover{color:var(--danger);}
.add-row{display:flex;gap:5px;margin-top:7px;}
.add-row input{flex:1;}
.add-row button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:7px 9px;border-radius:7px;cursor:pointer;font-size:14px;transition:.15s;flex-shrink:0;}
.add-row button:hover{background:var(--surface3);color:var(--text);}

/* ── ITEMS ── */
.items-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.items-hdr h3{font-size:13px;font-weight:600;color:var(--accent);}
.item-card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:7px;transition:.15s;}
.item-card:hover{border-color:var(--border2);}
.item-row{display:flex;gap:6px;margin-bottom:6px;}
.item-row input{font-size:12px;padding:6px 8px;}
.item-price{width:78px;color:var(--accent);text-align:right;flex-shrink:0;}
.item-desc textarea{font-size:11.5px;min-height:38px;padding:5px 7px;color:var(--text2);}
.item-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.badges{display:flex;gap:3px;}
.badge-btn{font-size:10px;padding:2px 7px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);color:var(--text3);background:transparent;font-family:inherit;transition:.15s;}
.badge-btn.on{background:#1d2d1d;color:#7c9;border-color:#446644;}
.badge-btn.hot.on{background:#2d1d1a;color:#f87;border-color:#664444;}
.badge-btn.new-b.on{background:#1a1d2d;color:#79f;border-color:#444466;}
.del-btn{background:transparent;border:1px solid #3a2020;color:var(--danger);padding:3px 7px;border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;transition:.15s;}
.del-btn:hover{background:#2a1010;}
.empty{text-align:center;color:var(--text3);font-size:12px;padding:1.2rem 0;font-style:italic;}

/* ── PREVIEW ── */
.preview-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#e8e0d4;}
.preview-wrap.dark{background:#1c1c1c;}
.preview-bar{padding:8px 12px;background:rgba(232,224,212,.9);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.preview-wrap.dark .preview-bar{background:rgba(22,22,22,.9);border-color:rgba(255,255,255,.07);}
.preview-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;}
.preview-wrap.dark .preview-label{color:#666;}
.pbar-right{display:flex;gap:5px;}
.pbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.75);color:#333;font-family:inherit;transition:.15s;}
.pbtn:hover{background:#fff;}
.pbtn.acc{background:#c9a96e;color:#fff;border-color:#a07840;}
.pbtn.acc:hover{background:#b8934f;}
.pbtn.pdf{background:#e03030;color:#fff;border-color:#b02020;}
.pbtn.pdf:hover{background:#c02020;}
.preview-wrap.dark .pbtn{background:rgba(255,255,255,.08);color:#ccc;border-color:rgba(255,255,255,.1);}
.preview-wrap.dark .pbtn:hover{background:rgba(255,255,255,.13);}
.pbtn svg{width:13px;height:13px;}
.preview-scroll{flex:1;overflow-y:auto;padding:1.5rem;}
#menuPreview{max-width:800px;margin:0 auto;}

/* ── LOADING OVERLAY ── */
.loading{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading.show{display:flex;}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:var(--text2);font-size:13px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:500;
  transform:translateY(16px);opacity:0;transition:.25s;z-index:998;display:flex;align-items:center;gap:7px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:var(--success);}
.toast.err{border-color:var(--danger);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ═══════════════════════════════
   MENU DESIGNS  (8 designs)
   ═══════════════════════════════ */

/* vars injected by JS */
.mc-menu{--mc-accent:#c9a96e;--mc-text:#2a2018;--mc-bg:#faf7f2;--mc-fs:15px;--mc-spacing:1;}

/* 1. ELEGANCE */
.mc-elegance{font-family:'Cormorant Garamond',serif;color:var(--mc-text);background:var(--mc-bg);padding:calc(2.5rem*var(--mc-spacing)) 3rem;border:1px solid #ddd;}
.mc-elegance .mh{text-align:center;border-bottom:1px solid var(--mc-accent);padding-bottom:1.8rem;margin-bottom:2rem;}
.mc-elegance .mh-name{font-size:calc(var(--mc-fs)*1.9);font-weight:600;letter-spacing:.07em;color:var(--mc-text);}
.mc-elegance .mh-sub{font-size:calc(var(--mc-fs)*.8);font-style:italic;color:var(--mc-accent);margin-top:.25rem;letter-spacing:.08em;}
.mc-elegance .mh-div{width:50px;height:1px;background:var(--mc-accent);margin:.9rem auto;}
.mc-elegance .mh-tag{font-size:calc(var(--mc-fs)*.78);color:#888;letter-spacing:.08em;}
.mc-elegance .mcat{margin-bottom:calc(2rem*var(--mc-spacing));}
.mc-elegance .mcat-t{font-size:calc(var(--mc-fs)*1.1);font-weight:600;letter-spacing:.06em;border-bottom:1px solid #e8e0d0;padding-bottom:.4rem;margin-bottom:1rem;}
.mc-elegance .mi{display:flex;align-items:baseline;gap:.4rem;padding:.55rem 0;border-bottom:1px dotted #ddd;}
.mc-elegance .mi:last-child{border-bottom:none;}
.mc-elegance .mi-info{flex:1;}
.mc-elegance .mi-name{font-size:var(--mc-fs);font-weight:600;}
.mc-elegance .mi-desc{font-size:calc(var(--mc-fs)*.8);font-style:italic;color:#888;margin-top:1px;}
.mc-elegance .mi-dots{flex:1;border-bottom:1px dotted var(--mc-accent);min-width:16px;margin:0 7px 4px;}
.mc-elegance .mi-price{font-size:var(--mc-fs);font-weight:600;color:var(--mc-accent);white-space:nowrap;}
.mc-elegance .mfoot{text-align:center;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid #e8e0d0;font-size:calc(var(--mc-fs)*.75);color:#aaa;font-style:italic;}

/* 2. NOIR */
.mc-noir{font-family:'Josefin Sans',sans-serif;color:#e8e0d0;background:#111;padding:calc(2.5rem*var(--mc-spacing)) 3rem;}
.mc-noir .mh{margin-bottom:2.5rem;padding-bottom:1.8rem;border-bottom:1px solid #2a2a2a;}
.mc-noir .mh-name{font-size:calc(var(--mc-fs)*1.8);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff;}
.mc-noir .mh-sub{font-size:calc(var(--mc-fs)*.72);letter-spacing:.28em;text-transform:uppercase;color:var(--mc-accent);margin-top:.3rem;}
.mc-noir .mh-div{width:36px;height:2px;background:var(--mc-accent);margin:.8rem 0;}
.mc-noir .mh-tag{font-size:calc(var(--mc-fs)*.75);color:#555;letter-spacing:.1em;}
.mc-noir .mcat{margin-bottom:calc(2.5rem*var(--mc-spacing));}
.mc-noir .mcat-t{font-size:calc(var(--mc-fs)*.68);letter-spacing:.28em;text-transform:uppercase;color:var(--mc-accent);margin-bottom:1rem;padding-bottom:.35rem;border-bottom:1px solid #222;}
.mc-noir .mi{display:grid;grid-template-columns:1fr auto;gap:8px;padding:.7rem 0;border-bottom:1px solid #1a1a1a;}
.mc-noir .mi:last-child{border-bottom:none;}
.mc-noir .mi-name{font-size:var(--mc-fs);font-weight:600;letter-spacing:.05em;}
.mc-noir .mi-desc{font-size:calc(var(--mc-fs)*.76);color:#666;margin-top:2px;line-height:1.4;}
.mc-noir .mi-price{font-size:var(--mc-fs);color:var(--mc-accent);font-weight:300;text-align:right;padding-top:2px;}
.mc-noir .mfoot{text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #222;font-size:calc(var(--mc-fs)*.68);color:#444;letter-spacing:.14em;text-transform:uppercase;}

/* 3. BISTRO */
.mc-bistro{font-family:'Libre Baskerville',serif;color:#1a1a1a;background:#fff;padding:calc(2.5rem*var(--mc-spacing)) 3rem;border:2px solid #1a1a1a;}
.mc-bistro .mh{text-align:center;margin-bottom:2rem;}
.mc-bistro .mh-name{font-size:calc(var(--mc-fs)*1.75);font-weight:700;text-transform:uppercase;letter-spacing:.12em;}
.mc-bistro .mh-sub{font-size:calc(var(--mc-fs)*.8);color:#666;letter-spacing:.18em;text-transform:uppercase;margin-top:.25rem;}
.mc-bistro .mh-div{display:flex;align-items:center;gap:10px;margin:.9rem 0;}
.mc-bistro .mh-div::before,.mc-bistro .mh-div::after{content:'';flex:1;height:1px;background:#1a1a1a;}
.mc-bistro .mh-div span{font-size:1rem;}
.mc-bistro .mh-tag{font-size:calc(var(--mc-fs)*.82);font-style:italic;color:#666;}
.mc-bistro .mcat{margin-bottom:calc(2rem*var(--mc-spacing));}
.mc-bistro .mcat-t{font-size:calc(var(--mc-fs)*.95);font-weight:700;text-transform:uppercase;letter-spacing:.15em;background:#1a1a1a;color:#fff;padding:.35rem .8rem;margin-bottom:1rem;display:inline-block;}
.mc-bistro .mi{display:flex;gap:.4rem;align-items:baseline;padding:.55rem 0;border-bottom:1px solid #eee;}
.mc-bistro .mi:last-child{border-bottom:none;}
.mc-bistro .mi-info{flex:1;}
.mc-bistro .mi-name{font-size:var(--mc-fs);font-weight:700;}
.mc-bistro .mi-desc{font-size:calc(var(--mc-fs)*.8);font-style:italic;color:#666;margin-top:1px;}
.mc-bistro .mi-dots{flex:1;border-bottom:2px dotted #ccc;min-width:16px;margin:0 7px 4px;}
.mc-bistro .mi-price{font-size:var(--mc-fs);font-weight:700;white-space:nowrap;}
.mc-bistro .mfoot{text-align:center;margin-top:1.5rem;font-size:calc(var(--mc-fs)*.78);color:#888;font-style:italic;border-top:1px solid #ddd;padding-top:1rem;}

/* 4. MINIMAL */
.mc-minimal{font-family:'Raleway',sans-serif;color:#222;background:#fefefe;padding:calc(2.5rem*var(--mc-spacing)) 3.5rem;}
.mc-minimal .mh{margin-bottom:2.5rem;}
.mc-minimal .mh-name{font-size:calc(var(--mc-fs)*1.7);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.mc-minimal .mh-sub{font-size:calc(var(--mc-fs)*.72);letter-spacing:.24em;text-transform:uppercase;color:#aaa;margin-top:.25rem;}
.mc-minimal .mh-div{width:28px;height:2px;background:#222;margin:.9rem 0;}
.mc-minimal .mh-tag{font-size:calc(var(--mc-fs)*.82);color:#aaa;line-height:1.6;}
.mc-minimal .mcat{margin-bottom:calc(2.5rem*var(--mc-spacing));}
.mc-minimal .mcat-t{font-size:calc(var(--mc-fs)*.64);letter-spacing:.3em;text-transform:uppercase;color:#bbb;margin-bottom:1.2rem;}
.mc-minimal .mi{display:flex;align-items:flex-start;padding:.8rem 0;border-bottom:1px solid #eee;}
.mc-minimal .mi:last-child{border-bottom:none;}
.mc-minimal .mi-info{flex:1;}
.mc-minimal .mi-name{font-size:var(--mc-fs);font-weight:600;letter-spacing:.02em;}
.mc-minimal .mi-desc{font-size:calc(var(--mc-fs)*.78);color:#bbb;margin-top:2px;line-height:1.5;}
.mc-minimal .mi-price{font-size:var(--mc-fs);font-weight:600;margin-left:1.2rem;white-space:nowrap;}
.mc-minimal .mfoot{margin-top:2.5rem;font-size:calc(var(--mc-fs)*.68);color:#ddd;letter-spacing:.12em;text-transform:uppercase;}

/* 5. BRASSERIE */
.mc-brasserie{font-family:'EB Garamond',serif;color:#2a1f10;background:#fdf6e8;padding:calc(2.5rem*var(--mc-spacing)) 3rem;border:1px solid #d4b878;position:relative;}
.mc-brasserie::before{content:'';position:absolute;inset:8px;border:1px solid #e8d4a0;pointer-events:none;}
.mc-brasserie .mh{text-align:center;margin-bottom:2rem;padding-bottom:1.8rem;border-bottom:2px solid var(--mc-accent);}
.mc-brasserie .mh-name{font-size:calc(var(--mc-fs)*2);font-weight:500;font-style:italic;color:var(--mc-text);letter-spacing:.04em;}
.mc-brasserie .mh-sub{font-size:calc(var(--mc-fs)*.85);color:#8a6a30;letter-spacing:.12em;text-transform:uppercase;margin-top:.3rem;}
.mc-brasserie .mh-div{color:var(--mc-accent);font-size:1.2rem;margin:.7rem 0;text-align:center;}
.mc-brasserie .mh-tag{font-size:calc(var(--mc-fs)*.85);color:#a08050;font-style:italic;}
.mc-brasserie .mcat{margin-bottom:calc(2rem*var(--mc-spacing));}
.mc-brasserie .mcat-t{font-size:calc(var(--mc-fs)*1.15);font-weight:500;font-style:italic;color:#5a3c10;text-align:center;border-top:1px solid #e0c880;border-bottom:1px solid #e0c880;padding:.4rem 0;margin-bottom:1rem;}
.mc-brasserie .mi{display:flex;gap:.4rem;align-items:baseline;padding:.55rem 0;}
.mc-brasserie .mi-info{flex:1;}
.mc-brasserie .mi-name{font-size:var(--mc-fs);font-weight:500;}
.mc-brasserie .mi-desc{font-size:calc(var(--mc-fs)*.82);color:#a08050;margin-top:1px;font-style:italic;}
.mc-brasserie .mi-dots{flex:1;border-bottom:1px dotted #d4b878;min-width:16px;margin:0 7px 4px;}
.mc-brasserie .mi-price{font-size:var(--mc-fs);font-weight:500;color:#7a5020;white-space:nowrap;}
.mc-brasserie .mfoot{text-align:center;margin-top:1.5rem;padding-top:1.2rem;border-top:2px solid var(--mc-accent);font-size:calc(var(--mc-fs)*.78);color:#b09060;font-style:italic;}

/* 6. MODERN */
.mc-modern{font-family:'Montserrat',sans-serif;color:#fff;background:#1e1e2e;padding:calc(2.5rem*var(--mc-spacing)) 3rem;}
.mc-modern .mh{display:flex;flex-direction:column;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid #ffffff0f;}
.mc-modern .mh-name{font-size:calc(var(--mc-fs)*1.8);font-weight:700;letter-spacing:.03em;background:linear-gradient(135deg,#fff 0%,var(--mc-accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mc-modern .mh-sub{font-size:calc(var(--mc-fs)*.7);letter-spacing:.22em;text-transform:uppercase;color:var(--mc-accent);margin-top:.3rem;-webkit-text-fill-color:var(--mc-accent);}
.mc-modern .mh-div{width:60px;height:1px;background:linear-gradient(90deg,var(--mc-accent),transparent);margin:.9rem 0;}
.mc-modern .mh-tag{font-size:calc(var(--mc-fs)*.8);color:#ffffff55;-webkit-text-fill-color:#ffffff55;}
.mc-modern .mcat{margin-bottom:calc(2.5rem*var(--mc-spacing));}
.mc-modern .mcat-t{font-size:calc(var(--mc-fs)*.68);letter-spacing:.24em;text-transform:uppercase;color:var(--mc-accent);margin-bottom:1.2rem;-webkit-text-fill-color:var(--mc-accent);}
.mc-modern .mi{display:flex;align-items:flex-start;padding:.9rem 1rem;border-radius:10px;margin-bottom:4px;background:#ffffff06;transition:.15s;}
.mc-modern .mi:hover{background:#ffffff0c;}
.mc-modern .mi-info{flex:1;}
.mc-modern .mi-name{font-size:var(--mc-fs);font-weight:600;}
.mc-modern .mi-desc{font-size:calc(var(--mc-fs)*.76);color:#ffffff55;margin-top:2px;-webkit-text-fill-color:#ffffff55;}
.mc-modern .mi-price{font-size:var(--mc-fs);font-weight:600;color:var(--mc-accent);margin-left:1rem;white-space:nowrap;-webkit-text-fill-color:var(--mc-accent);}
.mc-modern .mfoot{text-align:center;margin-top:2rem;font-size:calc(var(--mc-fs)*.7);color:#ffffff33;letter-spacing:.12em;text-transform:uppercase;-webkit-text-fill-color:#ffffff33;}

/* 7. CAFÉ */
.mc-cafe{font-family:'Lora',serif;color:#3a2e1e;background:#fef9f0;padding:calc(2.5rem*var(--mc-spacing)) 3rem;}
.mc-cafe .mh{text-align:center;margin-bottom:2rem;}
.mc-cafe .mh-name{font-size:calc(var(--mc-fs)*1.85);font-weight:600;font-style:italic;letter-spacing:.03em;}
.mc-cafe .mh-sub{font-size:calc(var(--mc-fs)*.82);color:var(--mc-accent);letter-spacing:.1em;margin-top:.2rem;}
.mc-cafe .mh-div{display:flex;align-items:center;justify-content:center;gap:8px;margin:.8rem 0;color:var(--mc-accent);font-size:.9rem;}
.mc-cafe .mh-tag{font-size:calc(var(--mc-fs)*.83);color:#9a8060;font-style:italic;}
.mc-cafe .mcat{margin-bottom:calc(2rem*var(--mc-spacing));}
.mc-cafe .mcat-t{font-size:calc(var(--mc-fs)*1.08);font-weight:600;font-style:italic;color:var(--mc-text);border-left:3px solid var(--mc-accent);padding-left:.7rem;margin-bottom:1rem;}
.mc-cafe .mi{padding:.6rem 0;border-bottom:1px dashed #e8dcc0;}
.mc-cafe .mi:last-child{border-bottom:none;}
.mc-cafe .mi-top{display:flex;justify-content:space-between;align-items:baseline;}
.mc-cafe .mi-name{font-size:var(--mc-fs);font-weight:600;}
.mc-cafe .mi-price{font-size:var(--mc-fs);font-weight:600;color:var(--mc-accent);margin-left:1rem;white-space:nowrap;}
.mc-cafe .mi-desc{font-size:calc(var(--mc-fs)*.8);color:#9a8060;margin-top:2px;font-style:italic;}
.mc-cafe .mfoot{text-align:center;margin-top:1.5rem;padding-top:1rem;border-top:1px dashed #e8dcc0;font-size:calc(var(--mc-fs)*.78);color:#b0a080;font-style:italic;}

/* 8. SUSHI / ASIA */
.mc-asia{font-family:'Work Sans',sans-serif;color:#0a0a0a;background:#f9f9f5;padding:calc(2.5rem*var(--mc-spacing)) 3rem;}
.mc-asia .mh{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:2.5rem;padding-bottom:2rem;position:relative;}
.mc-asia .mh::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--mc-accent) 30%,transparent);}
.mc-asia .mh-name{font-size:calc(var(--mc-fs)*2);font-weight:300;letter-spacing:.18em;text-transform:uppercase;}
.mc-asia .mh-accent{width:30px;height:3px;background:var(--mc-accent);margin:.5rem 0;}
.mc-asia .mh-sub{font-size:calc(var(--mc-fs)*.72);letter-spacing:.2em;text-transform:uppercase;color:var(--mc-accent);margin-bottom:.3rem;}
.mc-asia .mh-div{display:none;}
.mc-asia .mh-tag{font-size:calc(var(--mc-fs)*.8);color:#888;}
.mc-asia .mcat{margin-bottom:calc(2.2rem*var(--mc-spacing));}
.mc-asia .mcat-t{font-size:calc(var(--mc-fs)*.7);letter-spacing:.22em;text-transform:uppercase;color:var(--mc-accent);margin-bottom:1rem;font-weight:600;}
.mc-asia .mi{display:flex;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid #f0f0ec;}
.mc-asia .mi:last-child{border-bottom:none;}
.mc-asia .mi-num{font-size:calc(var(--mc-fs)*.72);color:#ccc;font-weight:600;min-width:24px;padding-top:2px;}
.mc-asia .mi-info{flex:1;}
.mc-asia .mi-name{font-size:var(--mc-fs);font-weight:500;letter-spacing:.01em;}
.mc-asia .mi-desc{font-size:calc(var(--mc-fs)*.78);color:#aaa;margin-top:2px;}
.mc-asia .mi-price{font-size:var(--mc-fs);font-weight:600;color:var(--mc-accent);margin-left:1rem;white-space:nowrap;}
.mc-asia .mfoot{text-align:right;margin-top:1.5rem;font-size:calc(var(--mc-fs)*.7);color:#ccc;letter-spacing:.1em;text-transform:uppercase;}

/* badge styles all designs */
.mc-menu .mbadge{display:inline-block;font-size:.6em;padding:1px 5px;border:1px solid;margin-left:4px;vertical-align:middle;font-style:normal;font-family:'Work Sans',sans-serif;border-radius:2px;}
.mc-menu .mb-veg{color:#3a7030;border-color:#3a7030;}
.mc-menu .mb-hot{color:#a03020;border-color:#a03020;}
.mc-menu .mb-new{color:#203490;border-color:#203490;}
.mc-noir .mb-veg{color:#5ca;border-color:#5ca;}
.mc-noir .mb-hot{color:#f87;border-color:#f87;}
.mc-noir .mb-new{color:#89c;border-color:#89c;}
.mc-modern .mb-veg{color:#5c8;border-color:#5c8;-webkit-text-fill-color:#5c8;}
.mc-modern .mb-hot{color:#f76;border-color:#f76;-webkit-text-fill-color:#f76;}
.mc-modern .mb-new{color:#79f;border-color:#79f;-webkit-text-fill-color:#79f;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  :root{--panel-w:100%;--topbar-h:52px;}
  .main{flex-direction:column;}
  .panel{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);flex-shrink:0;max-height:55vh;}
  .preview-wrap{flex:1;min-height:0;}
  .preview-scroll{padding:.8rem;}
  .topbar-center{display:none;}
  .menu-toggle{display:block;}
  .topbar-right .btn-ghost{display:none;}
  .mc-elegance,.mc-noir,.mc-bistro,.mc-minimal,.mc-brasserie,.mc-modern,.mc-cafe,.mc-asia{padding:1.5rem;}
  .mc-minimal{padding:1.5rem 1.8rem;}
  #menuPreview{max-width:100%;}
  .preview-bar{flex-wrap:wrap;gap:5px;padding:6px 10px;}
  .pbar-right{gap:4px;}
  .design-grid{grid-template-columns:1fr 1fr 1fr;}
}
@media(max-width:420px){
  .topbar{padding:0 .75rem;}
  .logo span{display:none;}
  .pbtn span{display:none;}
  .pbtn{padding:5px 7px;}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 14 14" fill="none"><path d="M2 3h10M2 6h7M2 9h8M2 12h5" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <span>MenuCraft</span>
  </div>
  <div class="topbar-center">
    <button class="tab-btn active" onclick="switchTab('info',this)">Restaurant</button>
    <button class="tab-btn" onclick="switchTab('design',this)">Design</button>
    <button class="tab-btn" onclick="switchTab('menu',this)">Speisekarte</button>
  </div>
  <div class="topbar-right">
    <button class="menu-toggle" onclick="toggleMobile()">☰</button>
    <button class="btn btn-ghost" onclick="doExportHTML()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
      HTML
    </button>
    <button class="btn btn-outline" onclick="doExportPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      PDF
    </button>
    <button class="btn btn-accent" onclick="doExportHTML()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
      Export
    </button>
  </div>
</header>

<div class="main">
<!-- ── LEFT PANEL ── -->
<aside class="panel" id="panel">

  <!-- TAB: RESTAURANT INFO -->
  <div class="panel-tab active" id="tab-info">
    <div class="sec">
      <div class="sec-label">Restaurant</div>
      <div class="field"><label>Name</label><input id="rName" type="text" value="Trattoria Bella" oninput="rp()"></div>
      <div class="field"><label>Untertitel / Küche</label><input id="rSub" type="text" value="Ristorante · Dal 1987" oninput="rp()"></div>
      <div class="field"><label>Tagline</label><textarea id="rTag" oninput="rp()">Frische Zutaten, traditionsreiche Rezepte aus der Toskana</textarea></div>
      <div class="field"><label>Fußzeile (Adresse, Tel.)</label><input id="rFoot" type="text" value="Via Roma 12 · Tel. 030 123456" oninput="rp()"></div>
      <div class="field"><label>Währungssymbol</label>
        <select id="rCurr" onchange="rp()">
          <option value="€">€ Euro</option>
          <option value="CHF">CHF Franken</option>
          <option value="$">$ Dollar</option>
          <option value="£">£ Pfund</option>
          <option value="">— kein Symbol</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TAB: DESIGN -->
  <div class="panel-tab" id="tab-design">
    <div class="sec">
      <div class="sec-label">Design wählen</div>
      <div class="design-grid" id="designGrid">
        <div class="dc active" data-d="elegance" onclick="setDesign('elegance',this)">
          <div class="dt" style="background:#faf7f2;border:1px solid #e0d0b0;">
            <div style="width:65%;height:5px;background:#c9b870;border-radius:1px;"></div>
            <div style="width:80%;height:2px;background:#ddd;border-radius:1px;"></div>
            <div style="width:55%;height:2px;background:#eee;border-radius:1px;"></div>
          </div>
          <div class="dn">Elegance</div>
        </div>
        <div class="dc" data-d="noir" onclick="setDesign('noir',this)">
          <div class="dt" style="background:#111;border:1px solid #333;">
            <div style="width:60%;height:4px;background:#c9a96e;border-radius:1px;"></div>
            <div style="width:78%;height:2px;background:#333;border-radius:1px;"></div>
            <div style="width:50%;height:2px;background:#222;border-radius:1px;"></div>
          </div>
          <div class="dn">Noir</div>
        </div>
        <div class="dc" data-d="bistro" onclick="setDesign('bistro',this)">
          <div class="dt" style="background:#fff;border:2px solid #1a1a1a;">
            <div style="width:65%;height:4px;background:#1a1a1a;border-radius:1px;"></div>
            <div style="width:80%;height:2px;background:#ccc;border-radius:1px;"></div>
            <div style="width:55%;height:2px;background:#ddd;border-radius:1px;"></div>
          </div>
          <div class="dn">Bistro</div>
        </div>
        <div class="dc" data-d="minimal" onclick="setDesign('minimal',this)">
          <div class="dt" style="background:#fefefe;border:1px solid #eee;">
            <div style="width:48%;height:4px;background:#222;border-radius:1px;align-self:flex-start;margin-left:10%;"></div>
            <div style="width:78%;height:1.5px;background:#eee;border-radius:1px;"></div>
            <div style="width:65%;height:1.5px;background:#f0f0f0;border-radius:1px;"></div>
          </div>
          <div class="dn">Minimal</div>
        </div>
        <div class="dc" data-d="brasserie" onclick="setDesign('brasserie',this)">
          <div class="dt" style="background:#fdf6e8;border:1px solid #d4b878;">
            <div style="width:70%;height:4px;background:#c9a030;border-radius:1px;"></div>
            <div style="width:82%;height:2px;background:#e8d4a0;border-radius:1px;"></div>
            <div style="width:58%;height:2px;background:#f0e0c0;border-radius:1px;"></div>
          </div>
          <div class="dn">Brasserie</div>
        </div>
        <div class="dc" data-d="modern" onclick="setDesign('modern',this)">
          <div class="dt" style="background:#1e1e2e;border:1px solid #333;">
            <div style="width:68%;height:4px;background:linear-gradient(90deg,#fff,#c9a96e);border-radius:1px;"></div>
            <div style="width:80%;height:2px;background:#ffffff10;border-radius:1px;"></div>
            <div style="width:55%;height:2px;background:#ffffff08;border-radius:1px;"></div>
          </div>
          <div class="dn">Modern</div>
        </div>
        <div class="dc" data-d="cafe" onclick="setDesign('cafe',this)">
          <div class="dt" style="background:#fef9f0;border:1px solid #e8d8b0;">
            <div style="width:66%;height:4px;background:#c9a050;border-radius:1px;font-style:italic;"></div>
            <div style="width:78%;height:2px;background:#e8d8b0;border-radius:1px;border-style:dashed;"></div>
            <div style="width:54%;height:2px;background:#f0e4c0;border-radius:1px;"></div>
          </div>
          <div class="dn">Café</div>
        </div>
        <div class="dc" data-d="asia" onclick="setDesign('asia',this)">
          <div class="dt" style="background:#f9f9f5;border:1px solid #e0e0d8;">
            <div style="width:70%;height:5px;background:#0a0a0a;border-radius:1px;font-weight:100;"></div>
            <div style="width:30px;height:2px;background:#c9a96e;border-radius:1px;align-self:flex-start;margin-left:10%;"></div>
            <div style="width:75%;height:1.5px;background:#eee;border-radius:1px;"></div>
          </div>
          <div class="dn">Asia</div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">Akzentfarbe</div>
      <div class="color-row" id="accentPicker">
        <div class="color-swatch on" style="background:#c9a96e;" data-c="#c9a96e" onclick="setAccent('#c9a96e',this)" title="Gold"></div>
        <div class="color-swatch" style="background:#c44b4b;" data-c="#c44b4b" onclick="setAccent('#c44b4b',this)" title="Rot"></div>
        <div class="color-swatch" style="background:#4b7ec4;" data-c="#4b7ec4" onclick="setAccent('#4b7ec4',this)" title="Blau"></div>
        <div class="color-swatch" style="background:#4ba87e;" data-c="#4ba87e" onclick="setAccent('#4ba87e',this)" title="Grün"></div>
        <div class="color-swatch" style="background:#9c6dc4;" data-c="#9c6dc4" onclick="setAccent('#9c6dc4',this)" title="Lila"></div>
        <div class="color-swatch" style="background:#c46b4b;" data-c="#c46b4b" onclick="setAccent('#c46b4b',this)" title="Orange"></div>
        <div class="color-swatch" style="background:#4bc4be;" data-c="#4bc4be" onclick="setAccent('#4bc4be',this)" title="Türkis"></div>
        <div class="color-swatch" style="background:#888;" data-c="#888" onclick="setAccent('#888',this)" title="Grau"></div>
        <div class="color-swatch" style="background:#1a1a1a;border:1px solid #555;" data-c="#1a1a1a" onclick="setAccent('#1a1a1a',this)" title="Schwarz"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">Schriftgröße & Abstände</div>
      <div class="slider-row">
        <label>Schriftgröße</label>
        <input type="range" min="12" max="20" value="15" id="fsSlider" oninput="updateStyle()">
        <span class="slider-val" id="fsVal">15px</span>
      </div>
      <div class="slider-row">
        <label>Zeilenabstand</label>
        <input type="range" min="70" max="140" value="100" id="spSlider" oninput="updateStyle()">
        <span class="slider-val" id="spVal">100%</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">Optionen</div>
      <div class="style-row">
        <div class="style-opt on" id="opt-dots" onclick="toggleOpt('dots',this)"><div class="dot"></div><span>Punktlinien</span></div>
        <div class="style-opt on" id="opt-desc" onclick="toggleOpt('desc',this)"><div class="dot"></div><span>Beschreibungen</span></div>
        <div class="style-opt on" id="opt-badges" onclick="toggleOpt('badges',this)"><div class="dot"></div><span>Badges (Veg etc.)</span></div>
        <div class="style-opt" id="opt-nums" onclick="toggleOpt('nums',this)"><div class="dot"></div><span>Nummern</span></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">Hintergrundvorschau</div>
      <div class="style-row">
        <div class="style-opt on" id="opt-bglight" onclick="setBg('light',this)"><div class="dot"></div><span>Hell</span></div>
        <div class="style-opt" id="opt-bgdark" onclick="setBg('dark',this)"><div class="dot"></div><span>Dunkel</span></div>
      </div>
    </div>
  </div>

  <!-- TAB: SPEISEKARTE -->
  <div class="panel-tab" id="tab-menu">
    <div class="sec">
      <div class="sec-label">Kategorien</div>
      <div class="cat-list" id="catList"></div>
      <div class="add-row">
        <input type="text" id="newCat" placeholder="Neue Kategorie…" onkeydown="if(event.key==='Enter')addCat()">
        <button onclick="addCat()">+</button>
      </div>
    </div>
    <div class="sec" style="flex:1;">
      <div class="items-hdr">
        <h3 id="catLabel">Gerichte</h3>
        <button class="btn btn-ghost" onclick="addItem()" style="padding:5px 9px;font-size:11px;">+ Gericht</button>
      </div>
      <div id="itemList"></div>
    </div>
  </div>

</aside>

<!-- ── PREVIEW ── -->
<section class="preview-wrap" id="previewWrap">
  <div class="preview-bar">
    <span class="preview-label">Vorschau</span>
    <div class="pbar-right">
      <button class="pbtn" onclick="setBg(previewDark?'light':'dark',document.getElementById('opt-bg'+(previewDark?'light':'dark')))">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Hintergrund</span>
      </button>
      <button class="pbtn acc" onclick="doExportHTML()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
        <span>HTML</span>
      </button>
      <button class="pbtn pdf" onclick="doExportPDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>PDF</span>
      </button>
    </div>
  </div>
  <div class="preview-scroll"><div id="menuPreview"></div></div>
</section>
</div>

<div class="loading" id="loading"><div class="spinner"></div><p id="loadingMsg">PDF wird erstellt…</p></div>
<div class="toast" id="toast"></div>

<script>
/* ─ STATE ─ */
const S = {
  design:'elegance',accent:'#c9a96e',
  opts:{dots:true,desc:true,badges:true,nums:false},
  fs:15,sp:100,
  cats:[
    {name:'Antipasti',items:[
      {n:'Bruschetta al Pomodoro',d:'Röstbrot, Tomaten, Basilikum, Olivenöl',p:'7,90',veg:true,hot:false,isnew:false},
      {n:'Vitello Tonnato',d:'Kalbsaufschnitt, Thunfischsauce, Kapern',p:'13,50',veg:false,hot:false,isnew:false},
    ]},
    {name:'Pasta',items:[
      {n:'Spaghetti Carbonara',d:'Guanciale, Ei, Pecorino, schwarzer Pfeffer',p:'14,90',veg:false,hot:false,isnew:false},
      {n:'Tagliatelle al Ragù',d:'Hausgemachte Pasta, klassisches Bolognese',p:'15,50',veg:false,hot:false,isnew:true},
      {n:"Penne all'Arrabbiata",d:'Scharfe Tomatensoße, Peperoncino',p:'12,90',veg:true,hot:true,isnew:false},
    ]},
    {name:'Pizze',items:[
      {n:'Margherita',d:'San-Marzano-Tomaten, Fior di Latte, Basilikum',p:'11,50',veg:true,hot:false,isnew:false},
      {n:'Diavola',d:'Tomatensauce, Mozzarella, scharfe Salami',p:'13,90',veg:false,hot:true,isnew:false},
    ]},
    {name:'Dolci',items:[
      {n:'Tiramisù della Casa',d:'Mascarpone, Savoiardi, Espresso',p:'6,50',veg:true,hot:false,isnew:false},
      {n:'Panna Cotta',d:'Mit Waldbeerensauce',p:'5,90',veg:true,hot:false,isnew:true},
    ]},
  ]
};
let activeCat=0, previewDark=false, mobilePanel=true;

/* ─ UTILS ─ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const g=id=>document.getElementById(id);
function toast(msg,type=''){const t=g('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800);}

/* ─ TABS ─ */
function switchTab(id,btn){
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  g('tab-'+id).classList.add('active');
  btn.classList.add('active');
}
function toggleMobile(){mobilePanel=!mobilePanel;g('panel').style.display=mobilePanel?'':'none';}

/* ─ DESIGN ─ */
function setDesign(d,el){
  S.design=d;
  document.querySelectorAll('.dc').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  rp();
}
function setAccent(c,el){
  S.accent=c;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  rp();
}
function updateStyle(){
  S.fs=parseInt(g('fsSlider').value);
  S.sp=parseInt(g('spSlider').value);
  g('fsVal').textContent=S.fs+'px';
  g('spVal').textContent=S.sp+'%';
  rp();
}
function toggleOpt(k,el){
  S.opts[k]=!S.opts[k];
  el.classList.toggle('on',S.opts[k]);
  rp();
}
function setBg(mode,el){
  previewDark=mode==='dark';
  const pw=g('previewWrap');
  pw.classList.toggle('dark',previewDark);
  document.querySelectorAll('#opt-bglight,#opt-bgdark').forEach(e=>e.classList.remove('on'));
  if(el) el.classList.add('on');
  rp();
}

/* ─ CATEGORIES ─ */
function renderCats(){
  const curr=g('rCurr')?.value||'€';
  g('catList').innerHTML=S.cats.map((c,i)=>`
    <div class="cat-item${i===activeCat?' active':''}" onclick="selCat(${i})">
      <span class="cat-name">${esc(c.name)}</span>
      <span class="cat-count">${c.items.length}</span>
      <span class="cat-del" onclick="event.stopPropagation();delCat(${i})" title="Löschen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>`).join('');
}
function selCat(i){activeCat=i;renderCats();renderItems();}
function addCat(){
  const v=g('newCat').value.trim();if(!v)return;
  S.cats.push({name:v,items:[]});g('newCat').value='';
  activeCat=S.cats.length-1;renderAll();toast('Kategorie hinzugefügt','ok');
}
function delCat(i){
  if(S.cats.length<=1){toast('Mindestens eine Kategorie erforderlich','err');return;}
  S.cats.splice(i,1);if(activeCat>=S.cats.length)activeCat=S.cats.length-1;
  renderAll();
}

/* ─ ITEMS ─ */
function renderItems(){
  const cat=S.cats[activeCat];
  g('catLabel').textContent=cat?cat.name:'Gerichte';
  if(!cat||!cat.items.length){g('itemList').innerHTML='<p class="empty">Noch keine Gerichte</p>';return;}
  g('itemList').innerHTML=cat.items.map((it,i)=>`
    <div class="item-card">
      <div class="item-row">
        <input type="text" value="${esc(it.n)}" placeholder="Gerichtname" oninput="upd(${i},'n',this.value)" style="flex:1;">
        <input type="text" class="item-price" value="${esc(it.p)}" placeholder="0,00" oninput="upd(${i},'p',this.value)">
      </div>
      <div class="item-desc"><textarea placeholder="Kurzbeschreibung (optional)" oninput="upd(${i},'d',this.value)">${esc(it.d)}</textarea></div>
      <div class="item-foot">
        <div class="badges">
          <button class="badge-btn${it.veg?' on':''}" onclick="tog(${i},'veg',this)">🌿 Veg</button>
          <button class="badge-btn hot${it.hot?' on':''}" onclick="tog(${i},'hot',this)">🌶 Scharf</button>
          <button class="badge-btn new-b${it.isnew?' on':''}" onclick="tog(${i},'isnew',this)">★ Neu</button>
        </div>
        <button class="del-btn" onclick="delItem(${i})">✕</button>
      </div>
    </div>`).join('');
}
function upd(i,k,v){S.cats[activeCat].items[i][k]=v;rp();}
function tog(i,k,el){
  const it=S.cats[activeCat].items[i];it[k]=!it[k];
  el.classList.toggle('on',it[k]);rp();
}
function addItem(){
  S.cats[activeCat].items.push({n:'Neues Gericht',d:'',p:'0,00',veg:false,hot:false,isnew:false});
  renderItems();rp();
}
function delItem(i){S.cats[activeCat].items.splice(i,1);renderItems();rp();}

/* ─ RENDER ─ */
function renderAll(){renderCats();renderItems();rp();}

function buildMenu(forExport=false){
  const n=g('rName').value,sb=g('rSub').value,tg=g('rTag').value,ft=g('rFoot').value;
  const curr=g('rCurr').value;
  const D=S.design,sp=(S.sp/100).toFixed(2);

  let num=0;

  const badges=(it)=>{
    if(!S.opts.badges&&!forExport) return '';
    let b='';
    if(it.veg) b+=`<span class="mbadge mb-veg">VEG</span>`;
    if(it.hot) b+=`<span class="mbadge mb-hot">SCHARF</span>`;
    if(it.isnew) b+=`<span class="mbadge mb-new">NEU</span>`;
    return b;
  };

  const desc=(it)=>{
    if(!S.opts.desc&&!forExport||!it.d) return '';
    return `<div class="mi-desc">${esc(it.d)}</div>`;
  };

  const catsHtml=S.cats.map(cat=>{
    if(!cat.items.length) return '';
    const items=cat.items.map(it=>{
      num++;
      const numSpan=S.opts.nums?`<span class="mi-num">${String(num).padStart(2,'0')}</span>`:'';
      const priceStr=it.p+(curr?` ${curr}`:'');

      if(D==='elegance'||D==='brasserie'||D==='bistro'){
        return `<div class="mi">${numSpan}
          <div class="mi-info"><span class="mi-name">${esc(it.n)}${badges(it)}</span>${desc(it)}</div>
          ${S.opts.dots?'<div class="mi-dots"></div>':''}
          <div class="mi-price">${esc(priceStr)}</div>
        </div>`;
      } else if(D==='cafe'){
        return `<div class="mi">${numSpan}
          <div class="mi-top"><span class="mi-name">${esc(it.n)}${badges(it)}</span><span class="mi-price">${esc(priceStr)}</span></div>
          ${desc(it)}
        </div>`;
      } else {
        return `<div class="mi">${numSpan}
          <div class="mi-info"><div class="mi-name">${esc(it.n)}${badges(it)}</div>${desc(it)}</div>
          <div class="mi-price">${esc(priceStr)}</div>
        </div>`;
      }
    }).join('');
    return `<div class="mcat"><div class="mcat-t">${esc(cat.name)}</div>${items}</div>`;
  }).join('');

  const dividers={
    elegance:`<div class="mh-div"></div>`,
    noir:`<div class="mh-div"></div>`,
    bistro:`<div class="mh-div"><span>✦</span></div>`,
    minimal:`<div class="mh-div"></div>`,
    brasserie:`<div class="mh-div">— ✦ —</div>`,
    modern:`<div class="mh-div"></div>`,
    cafe:`<div class="mh-div">· · ·</div>`,
    asia:`<div class="mh-accent"></div>`,
  };

  return `<div class="mc-menu mc-${D}" style="--mc-accent:${S.accent};--mc-fs:${S.fs}px;--mc-spacing:${sp};">
    <div class="mh">
      <div class="mh-name">${esc(n)}</div>
      <div class="mh-sub">${esc(sb)}</div>
      ${dividers[D]||''}
      <div class="mh-tag">${esc(tg)}</div>
    </div>
    ${catsHtml}
    ${ft?`<div class="mfoot">${esc(ft)}</div>`:''}
  </div>`;
}

function rp(){g('menuPreview').innerHTML=buildMenu();}

/* ─ EXPORT HTML ─ */
const fontURLs={
  elegance:'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap',
  noir:'https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap',
  bistro:'https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap',
  minimal:'https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap',
  brasserie:'https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap',
  modern:'https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap',
  cafe:'https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap',
  asia:'https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap',
};
const bgMap={elegance:'#f5f0e8',noir:'#0d0d0d',bistro:'#eeece8',minimal:'#f8f8f8',brasserie:'#f8f2e0',modern:'#16162a',cafe:'#f5f0e4',asia:'#f5f5f2'};

function getCSS(d){
  const all=[...document.styleSheets].flatMap(s=>{try{return[...s.cssRules].map(r=>r.cssText);}catch{return[];}});
  const relevant=all.filter(r=>r.includes('.mc-menu')||r.includes('.mc-'+d)||r.includes('.mh')||r.includes('.mi')||r.includes('.mcat')||r.includes('.mbadge')||r.includes('.mfoot'));
  return relevant.join('\n');
}

function doExportHTML(){
  const rName=g('rName').value;
  const css=getCSS(S.design);
  const body=buildMenu(true);
  const html=`<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(rName)} – Speisekarte</title>
<link href="${fontURLs[S.design]}" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:${bgMap[S.design]};padding:2rem 1rem;min-height:100vh;}
${css}
.mc-menu{max-width:720px;margin:0 auto;}
@media print{body{padding:0;}@page{margin:1.5cm;}}
</style>
</head>
<body>${body}</body>
</html>`;
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(rName||'speisekarte').replace(/\s+/g,'-').toLowerCase()+'.html';
  a.click();URL.revokeObjectURL(a.href);
  toast('✓ HTML heruntergeladen','ok');
}

/* ─ EXPORT PDF ─ */
async function doExportPDF(){
  const load=g('loading');const msg=g('loadingMsg');
  load.classList.add('show');msg.textContent='Vorschau wird gerendert…';
  await new Promise(r=>setTimeout(r,50));
  try{
    const el=g('menuPreview');
    msg.textContent='PDF wird erstellt…';
    const canvas=await html2canvas(el,{
      scale:2,useCORS:true,logging:false,
      backgroundColor:bgMap[S.design]||'#ffffff',
    });
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pW=pdf.internal.pageSize.getWidth();
    const pH=pdf.internal.pageSize.getHeight();
    const margin=10;
    const usableW=pW-margin*2;
    const ratio=canvas.height/canvas.width;
    const imgH=usableW*ratio;
    if(imgH<=pH-margin*2){
      pdf.addImage(imgData,'JPEG',margin,margin,usableW,imgH);
    } else {
      // Multi-page
      let posY=0;
      const pageH=pH-margin*2;
      const totalH=imgH;
      while(posY<totalH){
        if(posY>0) pdf.addPage();
        pdf.addImage(imgData,'JPEG',margin,margin-posY*(pW/usableW)*0,usableW,imgH);
        // clip via: offset position
        pdf.addImage(imgData,'JPEG',margin,margin-(posY/(totalH))*imgH,usableW,imgH);
        posY+=pageH;
      }
      // simpler: just one long A4 with auto height
      const jsPDF2=new jsPDF({orientation:'portrait',unit:'mm',format:[pW,imgH+margin*2]});
      jsPDF2.addImage(imgData,'JPEG',margin,margin,usableW,imgH);
      const rName=g('rName').value;
      jsPDF2.save((rName||'speisekarte').replace(/\s+/g,'-').toLowerCase()+'.pdf');
      load.classList.remove('show');
      toast('✓ PDF heruntergeladen','ok');
      return;
    }
    const rName=g('rName').value;
    pdf.save((rName||'speisekarte').replace(/\s+/g,'-').toLowerCase()+'.pdf');
    toast('✓ PDF heruntergeladen','ok');
  }catch(e){
    console.error(e);toast('Fehler beim PDF-Export','err');
  }
  load.classList.remove('show');
}

/* ─ INIT ─ */
renderAll();
</script>
</body>
</html>
