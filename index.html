<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speisekarten Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--surface3:#2a2a2a;
  --border:#333;--border2:#444;
  --text:#f0ede6;--text2:#a09a92;--text3:#666;
  --accent:#c9a96e;--accent2:#e8c98a;--accent-dim:#8a6f42;
  --danger:#d44;--success:#5a9;
  --radius:12px;--transition:0.2s ease;
}
body{background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

/* ── TOP BAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;color:var(--accent);}
.logo svg{width:28px;height:28px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:var(--transition);border:none;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2);}
.btn-primary{background:var(--accent);color:#1a1300;border:1px solid var(--accent);}
.btn-primary:hover{background:var(--accent2);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #533;}
.btn-danger:hover{background:#2a1111;}
.btn svg,.btn-ghost svg,.btn-primary svg{width:15px;height:15px;}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:340px 1fr;flex:1;overflow:hidden;height:calc(100vh - 64px);}

/* ── LEFT PANEL ── */
.panel{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
.panel-section{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);}
.panel-section:last-child{border-bottom:none;}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;}

/* ── RESTAURANT INFO ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500;}
.field input,.field textarea,.field select{
  width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit;
  transition:var(--transition);resize:vertical;
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent-dim);background:var(--surface3);}
.field textarea{min-height:56px;line-height:1.5;}
.field input[type=color]{padding:3px;height:34px;cursor:pointer;}

/* ── DESIGN PICKER ── */
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.design-card{
  border:2px solid var(--border);border-radius:10px;padding:10px 8px;cursor:pointer;
  transition:var(--transition);text-align:center;background:var(--surface2);
}
.design-card:hover{border-color:var(--border2);background:var(--surface3);}
.design-card.active{border-color:var(--accent);background:#211c0f;}
.design-thumb{height:54px;border-radius:6px;margin-bottom:6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.design-name{font-size:11px;color:var(--text2);font-weight:500;}
.design-card.active .design-name{color:var(--accent);}

/* ── CATEGORIES ── */
.cat-list{display:flex;flex-direction:column;gap:6px;}
.cat-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;
  transition:var(--transition);
}
.cat-item:hover{border-color:var(--border2);background:var(--surface3);}
.cat-item.active{border-color:var(--accent-dim);background:#211c0f;}
.cat-name{flex:1;font-size:13px;font-weight:500;}
.cat-count{font-size:11px;color:var(--text3);}
.cat-drag{color:var(--text3);cursor:grab;}
.cat-drag svg{width:14px;height:14px;}
.add-cat-row{display:flex;gap:6px;margin-top:8px;}
.add-cat-row input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-family:inherit;}
.add-cat-row input:focus{outline:none;border-color:var(--accent-dim);}

/* ── ITEMS ── */
.items-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.items-header h3{font-size:14px;font-weight:600;color:var(--accent);}
.item-list{display:flex;flex-direction:column;gap:8px;}
.item-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;transition:var(--transition);}
.item-card:hover{border-color:var(--border2);}
.item-top{display:flex;gap:8px;margin-bottom:8px;}
.item-top input[type=text]{flex:1;background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;font-family:inherit;}
.item-top input[type=text]:focus{outline:none;border-color:var(--accent-dim);}
.item-price{width:80px;background:var(--surface3);border:1px solid var(--border);color:var(--accent);padding:6px 8px;border-radius:6px;font-size:13px;font-family:inherit;text-align:right;}
.item-price:focus{outline:none;border-color:var(--accent-dim);}
.item-desc textarea{width:100%;background:var(--surface3);border:1px solid var(--border);color:var(--text2);padding:6px 8px;border-radius:6px;font-size:12px;font-family:inherit;resize:none;height:44px;line-height:1.4;}
.item-desc textarea:focus{outline:none;border-color:var(--accent-dim);}
.item-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.badge-row{display:flex;gap:4px;}
.badge{
  font-size:10px;padding:2px 7px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border2);color:var(--text3);background:transparent;font-family:inherit;
  transition:var(--transition);
}
.badge.on{background:#1e2e1e;color:#7c9;border-color:#446644;}
.badge.hot.on{background:#2e1e1a;color:#f97;border-color:#664444;}
.badge.new.on{background:#1a1e2e;color:#79f;border-color:#444466;}

/* ── PREVIEW PANE ── */
.preview-pane{background:#f5f0e8;overflow-y:auto;position:relative;}
.preview-pane.dark-preview{background:#1c1c1c;}
.preview-toolbar{
  position:sticky;top:0;z-index:10;background:rgba(245,240,232,0.92);
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,0.1);
  padding:8px 1.5rem;display:flex;align-items:center;justify-content:space-between;
}
.preview-pane.dark-preview .preview-toolbar{background:rgba(28,28,28,0.92);border-color:rgba(255,255,255,0.08);}
.preview-label{font-size:12px;font-weight:500;color:#666;letter-spacing:0.05em;text-transform:uppercase;}
.preview-pane.dark-preview .preview-label{color:#888;}
.preview-actions{display:flex;gap:8px;}
.preview-btn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;
  font-size:12px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:'Work Sans',sans-serif;
  border:1px solid rgba(0,0,0,0.15);background:rgba(255,255,255,0.8);color:#333;
}
.preview-btn:hover{background:#fff;border-color:rgba(0,0,0,0.25);}
.preview-btn.accent{background:#c9a96e;color:#fff;border-color:#b8934f;}
.preview-btn.accent:hover{background:#b8934f;}
.preview-pane.dark-preview .preview-btn{background:rgba(255,255,255,0.07);color:#ddd;border-color:rgba(255,255,255,0.12);}
.preview-pane.dark-preview .preview-btn:hover{background:rgba(255,255,255,0.12);}
.preview-btn svg{width:14px;height:14px;}
.preview-content{padding:2rem;}

/* ═══════════════════════════════════════
   MENU DESIGNS
   ═══════════════════════════════════════ */

/* 1. ELEGANCE (klassisch crème) */
.menu-elegance{
  max-width:680px;margin:0 auto;background:#faf7f2;
  font-family:'Cormorant Garamond',serif;color:#2c2318;
  padding:3rem 3.5rem;border:1px solid #e0d5c5;
}
.menu-elegance .m-header{text-align:center;border-bottom:1px solid #c9b87a;padding-bottom:2rem;margin-bottom:2.5rem;}
.menu-elegance .m-logo{font-size:2.6rem;font-weight:600;letter-spacing:0.06em;color:#2c2318;}
.menu-elegance .m-sub{font-size:1rem;font-style:italic;color:#8a7455;margin-top:0.3rem;letter-spacing:0.08em;}
.menu-elegance .m-divider{width:60px;height:1px;background:#c9b87a;margin:1rem auto;}
.menu-elegance .m-tagline{font-size:0.9rem;color:#8a7455;letter-spacing:0.1em;}
.menu-elegance .m-cat{margin-bottom:2.5rem;}
.menu-elegance .m-cat-title{font-size:1.5rem;font-weight:600;letter-spacing:0.06em;border-bottom:1px solid #e0d5c5;padding-bottom:0.5rem;margin-bottom:1.2rem;color:#2c2318;}
.menu-elegance .m-item{display:flex;align-items:baseline;gap:0.5rem;padding:0.6rem 0;border-bottom:1px dotted #e0d5c5;}
.menu-elegance .m-item:last-child{border-bottom:none;}
.menu-elegance .m-item-info{flex:1;}
.menu-elegance .m-item-name{font-size:1.05rem;font-weight:600;}
.menu-elegance .m-item-desc{font-size:0.85rem;font-style:italic;color:#8a7455;margin-top:2px;}
.menu-elegance .m-item-dots{flex:1;border-bottom:1px dotted #c9b87a;min-width:20px;margin:0 8px;margin-bottom:4px;}
.menu-elegance .m-item-price{font-size:1rem;font-weight:600;color:#8a6030;white-space:nowrap;}
.menu-elegance .m-badge{display:inline-block;font-size:0.65rem;letter-spacing:0.08em;padding:1px 6px;border:1px solid;margin-left:5px;vertical-align:middle;font-style:normal;}
.menu-elegance .m-badge-veg{color:#5a8a50;border-color:#5a8a50;}
.menu-elegance .m-badge-hot{color:#a04030;border-color:#a04030;}
.menu-elegance .m-badge-new{color:#4060a0;border-color:#4060a0;}
.menu-elegance .m-footer{text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #e0d5c5;font-size:0.8rem;color:#a09078;font-style:italic;}

/* 2. NOIR (dunkel, modern) */
.menu-noir{
  max-width:680px;margin:0 auto;background:#111;
  font-family:'Josefin Sans',sans-serif;color:#e8e0d0;padding:3rem;
}
.menu-noir .m-header{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid #333;}
.menu-noir .m-logo{font-size:2.4rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#fff;}
.menu-noir .m-sub{font-size:0.75rem;letter-spacing:0.3em;text-transform:uppercase;color:#c9a96e;margin-top:0.4rem;}
.menu-noir .m-tagline{font-size:0.8rem;color:#666;margin-top:0.5rem;letter-spacing:0.1em;}
.menu-noir .m-divider{width:40px;height:2px;background:#c9a96e;margin:1rem 0;}
.menu-noir .m-cat{margin-bottom:3rem;}
.menu-noir .m-cat-title{font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:#c9a96e;margin-bottom:1.2rem;padding-bottom:0.4rem;border-bottom:1px solid #333;}
.menu-noir .m-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:0.8rem 0;border-bottom:1px solid #1e1e1e;}
.menu-noir .m-item:last-child{border-bottom:none;}
.menu-noir .m-item-name{font-size:0.95rem;font-weight:600;letter-spacing:0.06em;}
.menu-noir .m-item-desc{font-size:0.78rem;color:#888;margin-top:3px;line-height:1.4;}
.menu-noir .m-item-price{font-size:1rem;color:#c9a96e;font-weight:300;letter-spacing:0.05em;text-align:right;margin-top:2px;}
.menu-noir .m-badge{display:inline-block;font-size:0.6rem;letter-spacing:0.1em;padding:1px 5px;margin-left:5px;text-transform:uppercase;}
.menu-noir .m-badge-veg{color:#5ca;background:#0d2420;}
.menu-noir .m-badge-hot{color:#f87;background:#2a1010;}
.menu-noir .m-badge-new{color:#89c;background:#10162a;}
.menu-noir .m-footer{text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #333;font-size:0.7rem;color:#555;letter-spacing:0.15em;text-transform:uppercase;}

/* 3. BISTRO (rustikales Weiß) */
.menu-bistro{
  max-width:680px;margin:0 auto;background:#fff;
  font-family:'Libre Baskerville',serif;color:#1a1a1a;padding:3rem;
  border:2px solid #1a1a1a;
}
.menu-bistro .m-header{text-align:center;margin-bottom:2.5rem;}
.menu-bistro .m-logo{font-size:2.2rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#1a1a1a;}
.menu-bistro .m-sub{font-size:0.85rem;color:#666;letter-spacing:0.2em;text-transform:uppercase;margin-top:0.3rem;}
.menu-bistro .m-divider{display:flex;align-items:center;gap:12px;margin:1rem 0;}
.menu-bistro .m-divider::before,.menu-bistro .m-divider::after{content:'';flex:1;height:1px;background:#1a1a1a;}
.menu-bistro .m-divider span{font-size:1.2rem;}
.menu-bistro .m-tagline{font-size:0.85rem;font-style:italic;color:#666;}
.menu-bistro .m-cat{margin-bottom:2.5rem;}
.menu-bistro .m-cat-title{font-size:1.1rem;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;background:#1a1a1a;color:#fff;padding:0.4rem 0.8rem;margin-bottom:1.2rem;display:inline-block;}
.menu-bistro .m-item{padding:0.65rem 0;border-bottom:1px solid #e8e8e8;display:flex;gap:0.5rem;align-items:baseline;}
.menu-bistro .m-item:last-child{border-bottom:none;}
.menu-bistro .m-item-info{flex:1;}
.menu-bistro .m-item-name{font-size:1rem;font-weight:700;}
.menu-bistro .m-item-desc{font-size:0.82rem;font-style:italic;color:#666;margin-top:2px;}
.menu-bistro .m-item-dots{flex:1;border-bottom:2px dotted #ccc;min-width:20px;margin:0 8px;margin-bottom:4px;}
.menu-bistro .m-item-price{font-size:1rem;font-weight:700;white-space:nowrap;}
.menu-bistro .m-badge{display:inline-block;font-size:0.62rem;padding:1px 5px;border:1.5px solid;margin-left:4px;font-style:normal;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.menu-bistro .m-badge-veg{color:#386028;border-color:#386028;}
.menu-bistro .m-badge-hot{color:#903020;border-color:#903020;}
.menu-bistro .m-badge-new{color:#203080;border-color:#203080;}
.menu-bistro .m-footer{text-align:center;margin-top:2rem;font-size:0.8rem;color:#888;font-style:italic;border-top:1px solid #ccc;padding-top:1rem;}

/* 4. MINIMAL (zeitlos clean) */
.menu-minimal{
  max-width:680px;margin:0 auto;background:#fefefe;
  font-family:'Raleway',sans-serif;color:#222;padding:3rem 4rem;
}
.menu-minimal .m-header{margin-bottom:3rem;}
.menu-minimal .m-logo{font-size:2rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.menu-minimal .m-sub{font-size:0.75rem;letter-spacing:0.25em;text-transform:uppercase;color:#999;margin-top:0.3rem;}
.menu-minimal .m-divider{width:2rem;height:2px;background:#222;margin:1rem 0;}
.menu-minimal .m-tagline{font-size:0.85rem;color:#888;line-height:1.6;}
.menu-minimal .m-cat{margin-bottom:3rem;}
.menu-minimal .m-cat-title{font-size:0.68rem;letter-spacing:0.3em;text-transform:uppercase;color:#999;margin-bottom:1.5rem;}
.menu-minimal .m-item{display:flex;align-items:flex-start;padding:0.9rem 0;border-bottom:1px solid #eee;}
.menu-minimal .m-item:last-child{border-bottom:none;}
.menu-minimal .m-item-info{flex:1;}
.menu-minimal .m-item-name{font-size:0.95rem;font-weight:600;letter-spacing:0.02em;}
.menu-minimal .m-item-desc{font-size:0.8rem;color:#aaa;margin-top:3px;line-height:1.5;}
.menu-minimal .m-item-price{font-size:0.95rem;font-weight:600;margin-left:1.5rem;white-space:nowrap;}
.menu-minimal .m-badge{display:inline-block;font-size:0.6rem;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;margin-left:4px;font-weight:700;}
.menu-minimal .m-badge-veg{background:#d8f0d0;color:#386028;}
.menu-minimal .m-badge-hot{background:#fde8e0;color:#903020;}
.menu-minimal .m-badge-new{background:#dce8fc;color:#203080;}
.menu-minimal .m-footer{margin-top:3rem;font-size:0.72rem;color:#ccc;letter-spacing:0.12em;text-transform:uppercase;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;
  transform:translateY(20px);opacity:0;transition:all 0.3s ease;z-index:999;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:var(--success);color:#7dc;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── EMPTY STATE ── */
.empty-msg{text-align:center;color:var(--text3);font-size:13px;padding:1.5rem 0;font-style:italic;}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="7" fill="#c9a96e" fill-opacity="0.15"/>
      <path d="M7 8h14M7 12h10M7 16h12M7 20h8" stroke="#c9a96e" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    MenuCraft
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" onclick="downloadHTML()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
      HTML herunterladen
    </button>
    <button class="btn btn-primary" onclick="downloadHTML()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
      Exportieren
    </button>
  </div>
</header>

<div class="main">

  <!-- LEFT PANEL -->
  <aside class="panel" id="leftPanel">

    <!-- Restaurant Info -->
    <div class="panel-section">
      <div class="section-label">Restaurant</div>
      <div class="field"><label>Name</label><input type="text" id="rName" value="Trattoria Bella" oninput="renderPreview()"></div>
      <div class="field"><label>Untertitel / Küche</label><input type="text" id="rSub" value="Ristorante · Dal 1987" oninput="renderPreview()"></div>
      <div class="field"><label>Tagline / Beschreibung</label><textarea id="rTagline" oninput="renderPreview()">Frische Zutaten, traditionsreiche Rezepte aus der Toskana</textarea></div>
      <div class="field"><label>Fußzeile (Adresse, Tel. etc.)</label><input type="text" id="rFooter" value="Via Roma 12 · Tel. 030 123456" oninput="renderPreview()"></div>
    </div>

    <!-- Design -->
    <div class="panel-section">
      <div class="section-label">Design wählen</div>
      <div class="design-grid" id="designGrid">
        <div class="design-card active" data-design="elegance" onclick="setDesign('elegance',this)">
          <div class="design-thumb" style="background:#faf7f2;border:1px solid #e0d5c5;">
            <div style="width:70%;height:6px;background:#c9b87a;border-radius:1px;"></div>
            <div style="width:85%;height:3px;background:#d8cbb5;border-radius:1px;"></div>
            <div style="width:60%;height:3px;background:#e8ddd0;border-radius:1px;"></div>
          </div>
          <div class="design-name">Elegance</div>
        </div>
        <div class="design-card" data-design="noir" onclick="setDesign('noir',this)">
          <div class="design-thumb" style="background:#111;border:1px solid #333;">
            <div style="width:65%;height:5px;background:#c9a96e;border-radius:1px;"></div>
            <div style="width:80%;height:3px;background:#444;border-radius:1px;"></div>
            <div style="width:55%;height:3px;background:#333;border-radius:1px;"></div>
          </div>
          <div class="design-name">Noir</div>
        </div>
        <div class="design-card" data-design="bistro" onclick="setDesign('bistro',this)">
          <div class="design-thumb" style="background:#fff;border:2px solid #1a1a1a;">
            <div style="width:70%;height:5px;background:#1a1a1a;border-radius:1px;"></div>
            <div style="width:85%;height:3px;background:#ccc;border-radius:1px;"></div>
            <div style="width:60%;height:3px;background:#ddd;border-radius:1px;"></div>
          </div>
          <div class="design-name">Bistro</div>
        </div>
        <div class="design-card" data-design="minimal" onclick="setDesign('minimal',this)">
          <div class="design-thumb" style="background:#fefefe;border:1px solid #eee;">
            <div style="width:50%;height:5px;background:#222;border-radius:1px;align-self:flex-start;margin-left:8%;"></div>
            <div style="width:80%;height:2px;background:#e8e8e8;border-radius:1px;"></div>
            <div style="width:70%;height:2px;background:#f0f0f0;border-radius:1px;"></div>
          </div>
          <div class="design-name">Minimal</div>
        </div>
      </div>
    </div>

    <!-- Kategorien -->
    <div class="panel-section">
      <div class="section-label">Kategorien</div>
      <div class="cat-list" id="catList"></div>
      <div class="add-cat-row">
        <input type="text" id="newCatInput" placeholder="Neue Kategorie…" onkeydown="if(event.key==='Enter')addCategory()">
        <button class="btn btn-ghost" onclick="addCategory()" style="padding:7px 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Gerichte der aktiven Kategorie -->
    <div class="panel-section" style="flex:1;">
      <div class="items-header">
        <h3 id="activeCatLabel">Gerichte</h3>
        <button class="btn btn-ghost" onclick="addItem()" style="padding:6px 10px;font-size:12px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Gericht
        </button>
      </div>
      <div class="item-list" id="itemList"></div>
    </div>
  </aside>

  <!-- RIGHT PREVIEW -->
  <section class="preview-pane" id="previewPane">
    <div class="preview-toolbar">
      <span class="preview-label">Vorschau</span>
      <div class="preview-actions">
        <button class="preview-btn" onclick="toggleBg()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          Hintergrund
        </button>
        <button class="preview-btn accent" onclick="downloadHTML()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-4-4 4 4 4-4"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
          HTML exportieren
        </button>
      </div>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
let currentDesign = 'elegance';
let currentCat = 0;
let darkBg = false;

const state = {
  categories: [
    {
      name: 'Antipasti', items: [
        {name:'Bruschetta al Pomodoro',desc:'Röstbrot mit Tomaten, Basilikum, Olivenöl',price:'7,90',veg:true,hot:false,isNew:false},
        {name:'Vitello Tonnato',desc:'Kalbsaufschnitt mit Thunfischsauce und Kapern',price:'13,50',veg:false,hot:false,isNew:false},
      ]
    },
    {
      name: 'Pasta', items: [
        {name:'Spaghetti Carbonara',desc:'Guanciale, Ei, Pecorino Romano, schwarzer Pfeffer',price:'14,90',veg:false,hot:false,isNew:false},
        {name:'Tagliatelle al Ragù',desc:'Klassisches Bolognese mit hausgemachter Pasta',price:'15,50',veg:false,hot:false,isNew:true},
        {name:'Penne all\'Arrabbiata',desc:'Scharfe Tomatensoße mit Peperoncino',price:'12,90',veg:true,hot:true,isNew:false},
      ]
    },
    {
      name: 'Pizze', items: [
        {name:'Margherita',desc:'San-Marzano-Tomaten, Fior di Latte, Basilikum',price:'11,50',veg:true,hot:false,isNew:false},
        {name:'Diavola',desc:'Tomatensauce, Mozzarella, scharfe Salami',price:'13,90',veg:false,hot:true,isNew:false},
      ]
    },
    {
      name: 'Dolci', items: [
        {name:'Tiramisù della Casa',desc:'Hausgemacht mit Mascarpone und Savoiardi',price:'6,50',veg:true,hot:false,isNew:false},
        {name:'Panna Cotta',desc:'Mit Waldbeerensauce',price:'5,90',veg:true,hot:false,isNew:true},
      ]
    },
  ]
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function setDesign(d, el) {
  currentDesign = d;
  document.querySelectorAll('.design-card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const pane = document.getElementById('previewPane');
  pane.classList.toggle('dark-preview', d === 'noir');
  renderPreview();
}

function toggleBg(){
  darkBg = !darkBg;
  document.getElementById('previewPane').style.background = darkBg ? '#2a2a2a' : '';
  renderPreview();
}

function renderCatList(){
  const el = document.getElementById('catList');
  el.innerHTML = state.categories.map((c,i)=>`
    <div class="cat-item${i===currentCat?' active':''}" onclick="selectCat(${i})">
      <span class="cat-name">${esc(c.name)}</span>
      <span class="cat-count">${c.items.length}</span>
      <span class="cat-drag" title="Löschen" onclick="event.stopPropagation();deleteCat(${i})" style="cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>
  `).join('');
}

function selectCat(i){
  currentCat = i;
  renderCatList();
  renderItems();
}

function addCategory(){
  const inp = document.getElementById('newCatInput');
  const v = inp.value.trim();
  if(!v) return;
  state.categories.push({name:v, items:[]});
  inp.value = '';
  currentCat = state.categories.length - 1;
  renderAll();
  showToast('Kategorie hinzugefügt', true);
}

function deleteCat(i){
  if(state.categories.length<=1){showToast('Mindestens eine Kategorie erforderlich');return;}
  state.categories.splice(i,1);
  if(currentCat >= state.categories.length) currentCat = state.categories.length - 1;
  renderAll();
}

function renderItems(){
  const cat = state.categories[currentCat];
  document.getElementById('activeCatLabel').textContent = cat ? cat.name : 'Gerichte';
  const el = document.getElementById('itemList');
  if(!cat || !cat.items.length){el.innerHTML='<p class="empty-msg">Noch keine Gerichte</p>';return;}
  el.innerHTML = cat.items.map((item,i)=>`
    <div class="item-card">
      <div class="item-top">
        <input type="text" value="${esc(item.name)}" placeholder="Gerichtname" oninput="updateItem(${i},'name',this.value)">
        <input class="item-price" type="text" value="${esc(item.price)}" placeholder="0,00" oninput="updateItem(${i},'price',this.value)">
      </div>
      <div class="item-desc">
        <textarea placeholder="Kurzbeschreibung (optional)" oninput="updateItem(${i},'desc',this.value)">${esc(item.desc)}</textarea>
      </div>
      <div class="item-footer">
        <div class="badge-row">
          <button class="badge${item.veg?' on':''}" onclick="toggleBadge(${i},'veg',this)">🌿 Veg</button>
          <button class="badge hot${item.hot?' on':''}" onclick="toggleBadge(${i},'hot',this)">🌶 Scharf</button>
          <button class="badge new${item.isNew?' on':''}" onclick="toggleBadge(${i},'new',this)">★ Neu</button>
        </div>
        <button class="btn btn-danger" onclick="deleteItem(${i})" style="padding:4px 8px;font-size:11px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function updateItem(i, key, val){
  state.categories[currentCat].items[i][key] = val;
  renderPreview();
}

function toggleBadge(i, key, el){
  const item = state.categories[currentCat].items[i];
  if(key==='new') item.isNew = !item.isNew;
  else item[key] = !item[key];
  el.classList.toggle('on');
  el.classList.toggle(key==='hot'?'hot':key==='new'?'new':'');
  renderPreview();
}

function addItem(){
  state.categories[currentCat].items.push({name:'Neues Gericht',desc:'',price:'0,00',veg:false,hot:false,isNew:false});
  renderItems();
  renderPreview();
}

function deleteItem(i){
  state.categories[currentCat].items.splice(i,1);
  renderItems();
  renderPreview();
}

function renderAll(){
  renderCatList();
  renderItems();
  renderPreview();
}

function buildMenuHTML(design, rName, rSub, rTagline, rFooter, cats){
  const d = design;
  let catHtml = cats.map(cat=>{
    if(!cat.items.length) return '';
    let itemsHtml = cat.items.map(item=>{
      let badges = '';
      if(item.veg) badges += `<span class="m-badge m-badge-veg">VEG</span>`;
      if(item.hot) badges += `<span class="m-badge m-badge-hot">SCHARF</span>`;
      if(item.isNew) badges += `<span class="m-badge m-badge-new">NEU</span>`;

      if(d==='elegance'||d==='bistro'){
        return `<div class="m-item">
          <div class="m-item-info"><span class="m-item-name">${esc(item.name)}${badges}</span>${item.desc?`<div class="m-item-desc">${esc(item.desc)}</div>`:''}
          </div><div class="m-item-dots"></div>
          <div class="m-item-price">${esc(item.price)} €</div></div>`;
      } else {
        return `<div class="m-item">
          <div class="m-item-info"><div class="m-item-name">${esc(item.name)}${badges}</div>${item.desc?`<div class="m-item-desc">${esc(item.desc)}</div>`:''}</div>
          <div class="m-item-price">${esc(item.price)} €</div></div>`;
      }
    }).join('');
    return `<div class="m-cat"><div class="m-cat-title">${esc(cat.name)}</div>${itemsHtml}</div>`;
  }).join('');

  const divider = d==='bistro'
    ? `<div class="m-divider"><span>✦</span></div>`
    : `<div class="m-divider"></div>`;

  return `<div class="menu-${d}">
    <div class="m-header">
      <div class="m-logo">${esc(rName)}</div>
      <div class="m-sub">${esc(rSub)}</div>
      ${divider}
      <div class="m-tagline">${esc(rTagline)}</div>
    </div>
    ${catHtml}
    ${rFooter?`<div class="m-footer">${esc(rFooter)}</div>`:''}
  </div>`;
}

function renderPreview(){
  const rName = document.getElementById('rName').value;
  const rSub = document.getElementById('rSub').value;
  const rTagline = document.getElementById('rTagline').value;
  const rFooter = document.getElementById('rFooter').value;
  document.getElementById('previewContent').innerHTML = buildMenuHTML(currentDesign, rName, rSub, rTagline, rFooter, state.categories);
}

function getStyles(){
  // Collect relevant style from the page
  const allStyles = Array.from(document.styleSheets)
    .flatMap(s=>{try{return Array.from(s.cssRules).map(r=>r.cssText);}catch{return [];}})
    .join('\n');
  // Extract only menu-relevant CSS
  return allStyles;
}

function downloadHTML(){
  const rName = document.getElementById('rName').value;
  const rSub = document.getElementById('rSub').value;
  const rTagline = document.getElementById('rTagline').value;
  const rFooter = document.getElementById('rFooter').value;
  const menuBody = buildMenuHTML(currentDesign, rName, rSub, rTagline, rFooter, state.categories);

  const fontMap = {
    elegance: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap",
    noir: "https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap",
    bistro: "https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap",
    minimal: "https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap"
  };

  const bgMap = { elegance:'#f5f0e8', noir:'#111', bistro:'#eee', minimal:'#f8f8f8' };

  const css = getDesignCSS(currentDesign);

  const html = `<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(rName)} – Speisekarte</title>
<link href="${fontMap[currentDesign]}" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:${bgMap[currentDesign]};padding:2rem 1rem;min-height:100vh;}
${css}
</style>
</head>
<body>
${menuBody}
</body>
</html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (rName||'speisekarte').replace(/\s+/g,'-').toLowerCase() + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Speisekarte heruntergeladen', true);
}

function showToast(msg, ok=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok?' success':'');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
